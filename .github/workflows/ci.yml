name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MKVIP_DATABASE_URL: postgresql+asyncpg://mkvip:mkvip@localhost:5432/mkvip
      MKVIP_TEST_POSTGRES_URL: postgresql+asyncpg://mkvip:mkvip@localhost:5432/mkvip
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mkvip
          POSTGRES_USER: mkvip
          POSTGRES_PASSWORD: mkvip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkvip -d mkvip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
