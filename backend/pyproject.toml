[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mkvip-api"
version = "0.12.0"
description = "API for MK Value Investing Platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<46",
  "email-validator>=2,<3",
  "fastapi>=0.115,<1",
  "openai>=2,<3",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.3,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "yfinance>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx2>=2.0,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
