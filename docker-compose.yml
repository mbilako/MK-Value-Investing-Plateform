services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mkvip}
      POSTGRES_USER: ${POSTGRES_USER:-mkvip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkvip}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mkvip} -d ${POSTGRES_DB:-mkvip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env.local
        required: false
    environment:
      MKVIP_DATABASE_URL: ${MKVIP_DATABASE_URL:-postgresql+asyncpg://mkvip:mkvip@db:5432/mkvip}
      MKVIP_ALLOWED_ORIGINS: '${MKVIP_ALLOWED_ORIGINS:-["http://localhost:5173"]}'
      MKVIP_SESSION_COOKIE_SECURE: ${MKVIP_SESSION_COOKIE_SECURE:-false}
      MKVIP_SESSION_DURATION_DAYS: ${MKVIP_SESSION_DURATION_DAYS:-30}
      MKVIP_LOGIN_MAX_ATTEMPTS: ${MKVIP_LOGIN_MAX_ATTEMPTS:-5}
      MKVIP_LOGIN_LOCK_MINUTES: ${MKVIP_LOGIN_LOCK_MINUTES:-15}
      MKVIP_AI_DAILY_QUOTA: ${MKVIP_AI_DAILY_QUOTA:-20}
      MKVIP_AI_CACHE_TTL_SECONDS: ${MKVIP_AI_CACHE_TTL_SECONDS:-3600}
      MKVIP_YAHOO_MAX_CONCURRENCY: ${MKVIP_YAHOO_MAX_CONCURRENCY:-8}
      MKVIP_YAHOO_RESPONSE_TIMEOUT_SECONDS: ${MKVIP_YAHOO_RESPONSE_TIMEOUT_SECONDS:-10}
      MKVIP_YAHOO_IMPORT_TIMEOUT_SECONDS: ${MKVIP_YAHOO_IMPORT_TIMEOUT_SECONDS:-30}
      MKVIP_YAHOO_IMPORTS_PER_USER: ${MKVIP_YAHOO_IMPORTS_PER_USER:-1}
      MKVIP_OPENAI_MODEL: ${MKVIP_OPENAI_MODEL:-gpt-5.6-sol}
      MKVIP_PUBLIC_APP_URL: ${MKVIP_PUBLIC_APP_URL:-http://localhost:5173}
      MKVIP_SMTP_HOST: ${MKVIP_SMTP_HOST:-mailpit}
      MKVIP_SMTP_PORT: ${MKVIP_SMTP_PORT:-1025}
      MKVIP_SMTP_FROM: ${MKVIP_SMTP_FROM:-MK-VIP <no-reply@mkvip.local>}
      MKVIP_SMTP_TIMEOUT_SECONDS: ${MKVIP_SMTP_TIMEOUT_SECONDS:-10}
      MKVIP_SMTP_STARTTLS: ${MKVIP_SMTP_STARTTLS:-false}
      MKVIP_SMTP_USERNAME: ${MKVIP_SMTP_USERNAME:-}
      MKVIP_SMTP_PASSWORD: ${MKVIP_SMTP_PASSWORD:-}
      MKVIP_AUTH_EMAIL_HASH_SECRET: ${MKVIP_AUTH_EMAIL_HASH_SECRET:-change-me-outside-local-development}
      MKVIP_EMAIL_VERIFICATION_TTL_HOURS: ${MKVIP_EMAIL_VERIFICATION_TTL_HOURS:-24}
      MKVIP_PASSWORD_RESET_TTL_MINUTES: ${MKVIP_PASSWORD_RESET_TTL_MINUTES:-30}
      MKVIP_AUTH_EMAIL_COOLDOWN_SECONDS: ${MKVIP_AUTH_EMAIL_COOLDOWN_SECONDS:-60}
      MKVIP_AUTH_EMAIL_MAX_PER_HOUR: ${MKVIP_AUTH_EMAIL_MAX_PER_HOUR:-5}
    command: >
      sh -c "alembic upgrade head &&
      uvicorn mkvip.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
